<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{titulo}} - Caballeros del Zodiaco - Archivo de personajes</title>
    <link rel="shortcut icon" href="" type="image/x-icon">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <header class="cabecera">
        <div class="cabecera-formulario">
            <form action="" method="GET" class="buscador">
                <input type="search" name="q" id="q" placeholder="Buscador...">
                <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>
        </div>

       <div class="cabecera-logo">
         <a href="/">
            <img class="logo" src="{{url_for('static' , filename='img/logo.png')}}" alt="">
        </a>
       </div>

        <nav class="cabecera-nav">
            <a href="{{url_for('index')}}">Inicio</a>
            <a href="">Novedades</a>
            <a href="">Personajes</a>
            <a href="">Categorias</a>
            <a href="">Creditos</a>
        </nav>
    </header>

    <main>
        {% block contenido %}
        {% endblock %}
    </main>

    <footer>Referencia Caballeros - Todos los derechos reservados 2026</footer>
</body>

</html>
